apiVersion: apps/v1
kind: Deployment
metadata:
  name: numberone-api
  namespace: numberone
  labels:
    app: numberone-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: numberone-api
  template:
    metadata:
      labels:
        app: numberone-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z numberone-postgres-service 5432; do
                echo "Waiting for Postgres..."
                sleep 2
              done
      containers:
        - name: numberone-api
          image: numberone-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: numberone-api-config
            - secretRef:
                name: numberone-api-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
