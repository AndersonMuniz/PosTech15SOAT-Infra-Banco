name: CI/CD Local - Banco de Dados

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-local-database-${{ github.ref }}
  cancel-in-progress: true

env:
  K8S_NAMESPACE: numberone

jobs:
  deploy-database:
    name: Deploy do banco no Kubernetes local
    runs-on: [self-hosted, runner-windows-0002]

    steps:
      - name: Checkout do codigo fonte
        uses: actions/checkout@v4

      - name: Validar acesso ao cluster Kubernetes local
        shell: cmd
        run: |
          kubectl version --client
          kubectl cluster-info
          kubectl config current-context

      - name: Aplicar manifesto YAML do namespace
        shell: cmd
        run: |
          kubectl apply -f .k8s/namespace.yaml

      - name: Aplicar ConfigMap, Secret, PVC e Service do banco
        shell: cmd
        run: |
          kubectl apply -f .k8s/db/configmap.yaml
          kubectl apply -f .k8s/db/secret.yaml
          kubectl apply -f .k8s/db/pvc.yaml
          kubectl apply -f .k8s/db/service.yaml

      - name: Deploy do banco de dados PostgreSQL
        shell: cmd
        run: |
          kubectl apply -f .k8s/db/deployment.yaml

      - name: Aguardar rollout do banco de dados PostgreSQL
        shell: cmd
        run: |
          kubectl rollout status deployment/numberone-postgres --namespace %K8S_NAMESPACE% --timeout=180s

      - name: Aplicar Service do Mailpit
        shell: cmd
        run: |
          kubectl apply -f .k8s/mailpit/service.yaml

      - name: Deploy do Mailpit para suporte aos testes de e-mail
        shell: cmd
        run: |
          kubectl apply -f .k8s/mailpit/deployment.yaml

      - name: Aguardar rollout do Mailpit
        shell: cmd
        run: |
          kubectl rollout status deployment/mailpit --namespace %K8S_NAMESPACE% --timeout=180s

      - name: Evidenciar recursos do banco aplicados no cluster
        shell: cmd
        run: |
          kubectl get configmap,secret,pvc,deployment,service --namespace %K8S_NAMESPACE%
          kubectl get pods --namespace %K8S_NAMESPACE% -o wide
