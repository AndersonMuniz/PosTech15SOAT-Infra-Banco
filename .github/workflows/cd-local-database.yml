name: CD Local - Banco de Dados

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cd-local-database-${{ github.ref }}
  cancel-in-progress: true

env:
  K8S_NAMESPACE: numberone

jobs:
  deploy-database:
    name: Deploy do banco local
    runs-on: [self-hosted, runner-windows-0002]

    steps:
      - name: Checkout do codigo fonte
        uses: actions/checkout@v4

      - name: Validar acesso ao cluster Kubernetes local
        shell: cmd
        run: |
          kubectl version --client
          kubectl cluster-info
          kubectl config current-context

      - name: Aplicar manifesto YAML do namespace
        shell: cmd
        run: |
          kubectl apply -f .k8s/namespace.yaml

      - name: Aplicar ConfigMap, Secret, PVC e Service do banco
        shell: cmd
        run: |
          kubectl apply -f .k8s/db/configmap.yaml
          kubectl apply -f .k8s/db/secret.yaml
          kubectl apply -f .k8s/db/pvc.yaml
          kubectl apply -f .k8s/db/service.yaml

      - name: Deploy do PostgreSQL local
        shell: cmd
        run: |
          kubectl apply -f .k8s/db/deployment.yaml

      - name: Aguardar rollout do PostgreSQL local
        shell: cmd
        run: |
          kubectl rollout status deployment/numberone-postgres --namespace %K8S_NAMESPACE% --timeout=180s

      - name: Aplicar Service do Mailpit
        shell: cmd
        run: |
          kubectl apply -f .k8s/mailpit/service.yaml

      - name: Deploy do Mailpit local
        shell: cmd
        run: |
          kubectl apply -f .k8s/mailpit/deployment.yaml

      - name: Aguardar rollout do Mailpit local
        shell: cmd
        run: |
          kubectl rollout status deployment/mailpit --namespace %K8S_NAMESPACE% --timeout=180s

      - name: Evidenciar recursos locais de banco e suporte
        shell: cmd
        run: |
          kubectl get configmap,secret,pvc,deployment,service --namespace %K8S_NAMESPACE%
          kubectl get pods --namespace %K8S_NAMESPACE% -o wide

      - name: Disparar workflow de deploy da API
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl.exe --fail-with-body -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer %GITHUB_TOKEN%" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/%GITHUB_REPOSITORY%/actions/workflows/cd-local-api.yml/dispatches -d "{\"ref\":\"develop\",\"inputs\":{\"image_tag\":\"%GITHUB_SHA%\"}}"
