spring:
  datasource:
    url: jdbc:h2:mem:numberone;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    jwt:
      issuer: numberone-api-test
      secret: test-jwt-secret-with-at-least-32-chars
      access-token-expiration: 30m
    bootstrap-admin:
      username: admin
      password: admin123456
      role: ADMIN
