name: CI

on:
  push:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build e testes unitarios
    runs-on: [self-hosted, runner-windows-0002]

    steps:
      - name: Checkout do codigo fonte
        uses: actions/checkout@v4

      - name: Configurar Java 25 com cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validar estrutura do projeto Maven
        shell: cmd
        run: .\mvnw.cmd -B validate

      - name: Build da aplicacao sem executar testes
        shell: cmd
        run: .\mvnw.cmd -B clean package -DskipTests

      - name: Executar testes unitarios
        shell: cmd
        run: .\mvnw.cmd -B test

      - name: Publicar relatorios dos testes unitarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-unitarios
          path: |
            target/surefire-reports
            target/site/jacoco-unit
          if-no-files-found: warn

  validate-kubernetes-manifests:
    name: Validar manifestos Kubernetes
    runs-on: [self-hosted, runner-windows-0002]

    steps:
      - name: Checkout do codigo fonte
        uses: actions/checkout@v4

      - name: Validar disponibilidade local do kubectl
        shell: cmd
        run: |
          kubectl version --client

      - name: Validar manifestos YAML sem aplicar no cluster
        shell: cmd
        run: |
          kubectl apply -k .k8s/overlays/local/database --dry-run=client --validate=false
          kubectl apply -k .k8s/overlays/local/api --dry-run=client --validate=false
          kubectl apply -k .k8s/overlays/local/full --dry-run=client --validate=false
          kubectl apply -k .k8s/overlays/aws/api --dry-run=client --validate=false

      - name: Evidenciar manifestos Kubernetes validados
        shell: cmd
        run: |
          for /r .k8s %%f in (*.yaml *.yml) do echo %%f
