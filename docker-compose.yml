services:
  postgres:
    image: postgres:latest
    container_name: numberone-db
    environment:
      POSTGRES_DB: numberone
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:latest
    container_name: numberone-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

