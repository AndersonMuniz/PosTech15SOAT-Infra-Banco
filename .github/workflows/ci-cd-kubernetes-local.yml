name: CI/CD Kubernetes Local

on:
  push:
    branches:
      - main
      - feature/automacao
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: numberone
  K8S_NAMESPACE: numberone

jobs:
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Executar testes unitários
        run: ./mvnw clean test

      - name: Publicar relatórios dos testes unitários
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-unitarios
          path: |
            target/surefire-reports/unit
            target/site/jacoco-unit
          if-no-files-found: warn

  deploy-local-kubernetes:
    name: Build e deploy no Kubernetes local
    runs-on: [self-hosted, runner-windows-0002]
    needs: unit-tests
    if: github.event_name != 'pull_request' && needs.unit-tests.result == 'success'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar acesso ao cluster Kubernetes local
        shell: pwsh
        run: |
          kubectl version --client
          kubectl cluster-info

      - name: Build da imagem Docker local
        shell: pwsh
        run: |
          $imageTag = "${env:IMAGE_NAME}:${env:GITHUB_SHA}"
          docker build --tag $imageTag --tag "${env:IMAGE_NAME}:latest" .

      - name: Aplicar manifests no Kubernetes local
        shell: pwsh
        run: |
          $imageTag = "${env:IMAGE_NAME}:${env:GITHUB_SHA}"
          $manifest = Get-Content "infraestrutura/kubernetes/application.yaml" -Raw
          $manifest = $manifest.Replace("__K8S_NAMESPACE__", $env:K8S_NAMESPACE)
          $manifest = $manifest.Replace("__IMAGE_URI__", $imageTag)
          $manifest | kubectl apply -f -

      - name: Aguardar rollout da aplicação
        shell: pwsh
        run: |
          kubectl rollout status deployment/numberone --namespace $env:K8S_NAMESPACE --timeout=180s
          kubectl get pods,services --namespace $env:K8S_NAMESPACE
