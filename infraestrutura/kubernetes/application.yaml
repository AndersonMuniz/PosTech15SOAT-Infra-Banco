apiVersion: v1
kind: Namespace
metadata:
  name: __K8S_NAMESPACE__
---
apiVersion: v1
kind: Secret
metadata:
  name: numberone-app
  namespace: __K8S_NAMESPACE__
type: Opaque
stringData:
  DB_USERNAME: admin
  DB_PASSWORD: admin
  JWT_SECRET: change-this-local-jwt-secret-with-32-chars
  BOOTSTRAP_ADMIN_USERNAME: admin
  BOOTSTRAP_ADMIN_PASSWORD: admin123456
  BOOTSTRAP_ADMIN_ROLE: ADMIN
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: numberone-app
  namespace: __K8S_NAMESPACE__
data:
  DB_URL: jdbc:postgresql://numberone-postgres:5432/numberone
  MAIL_HOST: numberone-mailpit
  MAIL_PORT: "1025"
  APP_MAIL_FROM: no-reply@numberone.local
  SERVICE_ORDER_APPROVAL_BASE_URL: http://localhost:30080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: numberone-postgres-data
  namespace: __K8S_NAMESPACE__
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: numberone-postgres
  namespace: __K8S_NAMESPACE__
  labels:
    app: numberone-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: numberone-postgres
  template:
    metadata:
      labels:
        app: numberone-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: numberone
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: numberone-app
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: numberone-app
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
                - -d
                - numberone
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: numberone-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: numberone-postgres
  namespace: __K8S_NAMESPACE__
  labels:
    app: numberone-postgres
spec:
  selector:
    app: numberone-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: numberone-mailpit
  namespace: __K8S_NAMESPACE__
  labels:
    app: numberone-mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: numberone-mailpit
  template:
    metadata:
      labels:
        app: numberone-mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
---
apiVersion: v1
kind: Service
metadata:
  name: numberone-mailpit
  namespace: __K8S_NAMESPACE__
  labels:
    app: numberone-mailpit
spec:
  selector:
    app: numberone-mailpit
  ports:
    - name: smtp
      protocol: TCP
      port: 1025
      targetPort: smtp
    - name: http
      protocol: TCP
      port: 8025
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: numberone
  namespace: __K8S_NAMESPACE__
  labels:
    app: numberone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: numberone
  template:
    metadata:
      labels:
        app: numberone
    spec:
      containers:
        - name: numberone
          image: __IMAGE_URI__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: numberone-app
            - secretRef:
                name: numberone-app
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: numberone
  namespace: __K8S_NAMESPACE__
  labels:
    app: numberone
spec:
  type: NodePort
  selector:
    app: numberone
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
      nodePort: 30080
