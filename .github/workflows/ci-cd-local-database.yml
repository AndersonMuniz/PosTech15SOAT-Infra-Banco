name: CI/CD Local - Banco de Dados

on:
  workflow_run:
    workflows:
      - CI Local - Validacao
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-local-database-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  K8S_NAMESPACE: numberone

jobs:
  deploy-database:
    name: Deploy do banco no Kubernetes local
    runs-on: [self-hosted, runner-windows-0002]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout do codigo fonte
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validar acesso ao cluster Kubernetes local
        shell: pwsh
        run: |
          kubectl version --client
          kubectl cluster-info
          kubectl config current-context

      - name: Aplicar manifesto YAML do namespace
        shell: pwsh
        run: |
          kubectl apply -f .k8s/namespace.yaml

      - name: Aplicar ConfigMap, Secret, PVC e Service do banco
        shell: pwsh
        run: |
          kubectl apply -f .k8s/db/configmap.yaml
          kubectl apply -f .k8s/db/secret.yaml
          kubectl apply -f .k8s/db/pvc.yaml
          kubectl apply -f .k8s/db/service.yaml

      - name: Deploy do banco de dados PostgreSQL
        shell: pwsh
        run: |
          kubectl apply -f .k8s/db/deployment.yaml

      - name: Aguardar rollout do banco de dados PostgreSQL
        shell: pwsh
        run: |
          kubectl rollout status deployment/numberone-postgres --namespace $env:K8S_NAMESPACE --timeout=180s

      - name: Aplicar Service do Mailpit
        shell: pwsh
        run: |
          kubectl apply -f .k8s/mailpit/service.yaml

      - name: Deploy do Mailpit para suporte aos testes de e-mail
        shell: pwsh
        run: |
          kubectl apply -f .k8s/mailpit/deployment.yaml

      - name: Aguardar rollout do Mailpit
        shell: pwsh
        run: |
          kubectl rollout status deployment/mailpit --namespace $env:K8S_NAMESPACE --timeout=180s

      - name: Evidenciar recursos do banco aplicados no cluster
        shell: pwsh
        run: |
          kubectl get configmap,secret,pvc,deployment,service --namespace $env:K8S_NAMESPACE
          kubectl get pods --namespace $env:K8S_NAMESPACE -o wide
