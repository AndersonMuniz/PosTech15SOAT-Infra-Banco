spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/numberone}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-local-jwt-secret-with-32-chars}
    bootstrap-admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123456}
      role: ${BOOTSTRAP_ADMIN_ROLE:ADMIN}
