name: CI/CD Local Docker

on:
  push:
    branches:
      - main
      - feature/automacao
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Executar testes unitários
        run: ./mvnw clean test

      - name: Publicar relatórios dos testes unitários
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-unitarios
          path: |
            target/surefire-reports/unit
            target/site/jacoco-unit
          if-no-files-found: warn

  local-docker-deploy:
    name: Deploy local com Docker Compose
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name != 'pull_request' && needs.unit-tests.result == 'success'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker local
        run: docker compose build app

      - name: Deploy local da aplicação
        run: docker compose up -d postgres mailpit app

      - name: Validar containers locais
        run: docker compose ps

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Encerrar ambiente local
        if: always()
        run: docker compose down
