apiVersion: apps/v1
kind: Deployment
metadata:
  name: numberone-postgres
  namespace: numberone
  labels:
    app: numberone-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: numberone-postgres
  template:
    metadata:
      labels:
        app: numberone-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: numberone-postgres-config
            - secretRef:
                name: numberone-postgres-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
                - -d
                - numberone
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
                - -d
                - numberone
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: numberone-postgres-data
