services:
  postgres:
    image: postgres:17-alpine
    container_name: numberone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-numberone}
      POSTGRES_USER: ${POSTGRES_USER:-numberone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/V1__create_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numberone} -d ${POSTGRES_DB:-numberone}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
