name: CI Gratuito GitHub Actions

on:
  push:
    branches:
      - main
      - feature/automacao
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Executar testes unitários
        run: ./mvnw clean test

      - name: Publicar relatórios dos testes unitários
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-unitarios
          path: |
            target/surefire-reports/unit
            target/site/jacoco-unit
          if-no-files-found: warn

  docker-build:
    name: Validar build Docker
    runs-on: ubuntu-24.04
    needs: unit-tests
    if: github.event_name != 'pull_request' && needs.unit-tests.result == 'success'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker local
        run: docker compose build app
